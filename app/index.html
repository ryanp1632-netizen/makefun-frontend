<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>make.fun bounties</title>
<link rel="icon" href="data:,">
<body style="margin:0;font:14px system-ui,sans-serif;background:#f4f5f7">
<header style="height:56px;background:#0f172a;color:#fff"><a href="#/">make.fun <b>bounties</b></a><form><input name="u" placeholder="Find a profile" aria-label="Find a profile"></form><output></output><button>Refresh</button></header>
<main><section></section><section></section></main>
<script type="module">
const ROUTES = [
  ['board', /^#\/?$/, () => import('./board.js')],
  ['bounty', /^#\/bounty\/([\w-]+)\/?$/, () => import('./bounty.js')],
  ['leaderboard', /^#\/bounty\/([\w-]+)\/leaderboard\/?$/, () => import('./leaderboard.js')],
  ['profile', /^#\/u\/([\w.-]+)\/?$/, () => import('./profile.js')],
];
async function routeTo(refresh) {
  const seq = (routeTo.seq = (routeTo.seq || 0) + 1), hash = location.hash || '#/';
  const [name, re, load] = ROUTES.find((r) => r[1].test(hash)) ?? ROUTES[0];
  window.__shotReady = false;
  document.body.dataset.route = name;
  try {
    const [view, api] = await Promise.all([load(), import('./api.js')]);
    api.startView(refresh === true);
    if (seq == routeTo.seq) await view.default(decodeURIComponent(hash.match(re)?.[1] ?? ''));
  } catch (e) {
    document.querySelector('main').lastChild.textContent = 'Could not load this view: ' + e.message;
  }
  if (seq == routeTo.seq) window.__shotReady = true;
}
addEventListener('hashchange', routeTo);
document.forms[0].addEventListener('submit', (e) => {
  e.preventDefault();
  location.hash = '#/u/' + encodeURIComponent(e.target.u.value.trim().replace(/^@/, ''));
  e.target.u.blur();
});
document.querySelector('button').addEventListener('click', () => routeTo(true));
routeTo();
</script>
